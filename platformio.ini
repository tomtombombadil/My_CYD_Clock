; My CYD Clock
;
; This file describes three different Cheap Yellow Display boards. Each one is
; a block below starting with [env:...]. You pick which board you are flashing
; from the dropdown at the bottom of VS Code, and nothing in this file needs
; editing to switch between them.
;
;   cyd28    2.8 inch    ESP32-2432S028R    240 x 320
;   cyd32    3.2 inch    ESP32-2432S032R    240 x 320
;   cyd35    3.5 inch    ESP32-3248S035R    320 x 480
;                        also the 4.0 inch board using the same panel
;
; The README explains how to choose one and flash it.

[platformio]
; Which board the buttons along the bottom of VS Code act on unless you pick a
; different one. Without this line those buttons would try to build and upload
; all three boards one after another, which is not what you want.
;
; You do not have to edit this to switch boards. The README explains how to
; pick one from the sidebar instead. Change it only if you want a different
; board to be the one you get by default.
default_envs = cyd28

; ---------------------------------------------------------------------------
; Settings shared by all three boards
; ---------------------------------------------------------------------------
[env]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.partitions = huge_app.csv

; After every build, join the four pieces a blank chip needs into one file in
; docs/firmware, ready for the web flashing page. See merge_firmware.py.
extra_scripts = post:merge_firmware.py

; The platform version is pinned on purpose. Version 6.9.0 gives you Arduino
; core 2.0.17, which is what the web server library below was built for. If
; you let PlatformIO fetch the newest platform it installs core 3.x and the
; web server no longer compiles.

lib_deps =
  bodmer/TFT_eSPI@^2.5.43
  tzapu/WiFiManager@^2.0.17
  esphome/AsyncTCP-esphome@^2.1.1
  esphome/ESPAsyncWebServer-esphome@^3.1.0
  bblanchon/ArduinoJson@^6.21.5
  https://github.com/PaulStoffregen/XPT2046_Touchscreen.git

build_flags =
  -D USER_SETUP_LOADED=1
; Stops the display library printing a warning about its own touch support on
; the 2.8 inch board, where we drive the touch panel with a separate library.
  -D DISABLE_ALL_LIBRARY_WARNINGS=1

; All three boards wire the display to the same six pins.
  -D TFT_MISO=12
  -D TFT_MOSI=13
  -D TFT_SCLK=14
  -D TFT_CS=15
  -D TFT_DC=2
  -D TFT_RST=-1
  -D TFT_BACKLIGHT_ON=HIGH
  -D TFT_RGB_ORDER=TFT_BGR

; The ESP32 has two usable SPI controllers, called HSPI and VSPI. This puts
; the display on HSPI, where its pins already are. On the 2.8 inch board that
; leaves VSPI free for the touch panel, which has wires of its own.
  -D USE_HSPI_PORT=1

; Fonts. The seven segment numerals are drawn by the program rather than taken
; from a font, so only the plain faces are loaded here.
  -D LOAD_GLCD=1
  -D LOAD_FONT2=1
  -D LOAD_FONT4=1
  -D LOAD_GFXFF=1

  -D SPI_FREQUENCY=55000000
  -D SPI_READ_FREQUENCY=20000000
  -D SPI_TOUCH_FREQUENCY=2500000
  -D CORE_DEBUG_LEVEL=1

; ---------------------------------------------------------------------------
; 2.8 inch    ESP32-2432S028R
; ---------------------------------------------------------------------------
; The touch panel here has four wires of its own, so the XPT2046 library
; drives it on the second SPI controller. TOUCH_CS is deliberately not set.
[env:cyd28]
build_flags =
  ${env.build_flags}
  -D BOARD_CYD28=1
  -D ST7789_DRIVER=1
  -D TFT_INVERSION_OFF=1
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=320
  -D TFT_BL=21

; There are two versions of this board. Most use an ILI9341 controller and
; some newer ones use an ST7789. ST7789 is set above because that is what
; works on the board this firmware was written on. If your screen stays black,
; shows nonsense, or the colours are clearly wrong, comment out the two
; ST7789 lines above and use these two instead:
;   -D ILI9341_2_DRIVER=1
;   -D TFT_INVERSION_OFF=1

; ---------------------------------------------------------------------------
; 3.2 inch    ESP32-2432S032R
; ---------------------------------------------------------------------------
; Same screen size as the 2.8 inch, but the backlight moved to pin 27 and the
; touch panel shares the display's wires. Setting TOUCH_CS is what tells the
; display library to handle the touch panel itself.
[env:cyd32]
build_flags =
  ${env.build_flags}
  -D BOARD_CYD32=1
  -D ST7789_DRIVER=1
  -D TFT_INVERSION_OFF=1
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=320
  -D TFT_BL=27
  -D TOUCH_CS=33

; ---------------------------------------------------------------------------
; 3.5 inch    ESP32-3248S035R    (and the 4.0 inch board using the same panel)
; ---------------------------------------------------------------------------
; A bigger screen, 480 across by 320 down once the clock turns it sideways.
[env:cyd35]
build_flags =
  ${env.build_flags}
  -D BOARD_CYD35=1
  -D ST7796_DRIVER=1
  -D TFT_WIDTH=320
  -D TFT_HEIGHT=480
  -D TFT_BL=27
  -D TOUCH_CS=33

; If the colours on any of these boards come out looking like a photographic
; negative, that is not a build setting any more. Tick "Invert colours" on the
; settings page, under Time Display, and save. It takes effect immediately.
;
; If reds and blues are swapped, which is a different problem, change
; TFT_RGB_ORDER at the top of this file from TFT_BGR to TFT_RGB.
